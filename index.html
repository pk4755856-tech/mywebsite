<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f2f2f2;
        }

        header {
            background: #222;
            color: white;
            padding: 25px;
        }

        h1 {
            margin: 0;
        }

        .box {
            background: white;
            margin: 50px auto;
            padding: 30px;
            max-width: 600px;
            border-radius: 15px;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            background: #222;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #555;
        }
    </style>
</head>

<body>

    <header>
        <h1>Welcome to My Website</h1>
        <p>My First Website</p>
    </header>

    <div class="box">
        <h2>Hello 👋</h2>
        <p>This is my first website made with HTML and CSS.</p>

        <button onclick="alert('Welcome to my website!')">
            Click Me
        </button>
    </div>

</body>
</html>
